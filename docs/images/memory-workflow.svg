<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">EvoMyn：记录日常，回顾成长，记得下一件事</title>
  <desc id="desc">ESP 智能设备通过小智云端记录与查询，PC 主动连接云端并在后台提供 MCP 和本地记忆库。Codex、Claude Code 等本机客户端同时通过 MCP 检索、整理和写回记忆，并使用各自模型提供建议。设备还支持本地提醒，并可经独立网关归档用户确认的完成事件。无需自建服务器，语音记忆访问需要 PC 在线。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#6c756f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="800" rx="24" fill="#f6f5f1"/>
  <g font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
    <text x="48" y="54" fill="#69736c" font-size="16" font-weight="600" letter-spacing="3">EVOMYN / HOW IT WORKS</text>
    <text x="48" y="102" fill="#252d28" font-size="32" font-weight="600">让 AI 从你的经历中了解你</text>
    <text x="1152" y="99" fill="#69736c" font-size="17" text-anchor="end">经历 · 人脉 · 成长 · 提醒</text>

    <path d="M 210 244 V 174 H 600 V 244" fill="none" stroke="#6c756f" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <rect x="280" y="148" width="250" height="52" rx="26" fill="#f6f5f1" stroke="#c5ccc6"/>
    <text x="405" y="180" text-anchor="middle" fill="#35443b" font-size="19" font-weight="600">小智云端 · 语音与工具调用</text>
    <text x="194" y="216" text-anchor="end" fill="#69736c" font-size="15">设备联网</text>
    <text x="616" y="216" fill="#69736c" font-size="15">PC 主动连接云端</text>

    <rect x="48" y="244" width="324" height="306" rx="18" fill="#fff" stroke="#dce0d9"/>
    <text x="76" y="282" fill="#7a827b" font-size="15" font-weight="600">01 / 随口记录与查询</text>
    <circle cx="99" cy="332" r="23" fill="#f1eee6" stroke="#d7d2c6"/>
    <rect x="95" y="318" width="8" height="21" rx="4" fill="none" stroke="#807353" stroke-width="2"/>
    <path d="M 90 332 A 9 9 0 0 0 108 332 M 99 341 V 348 M 93 348 H 105" fill="none" stroke="#807353" stroke-width="2" stroke-linecap="round"/>
    <text x="136" y="339" fill="#252d28" font-size="25" font-weight="600">ESP 智能设备</text>
    <text x="76" y="390" fill="#535e56" font-size="19">“记一下今天做过的事。”</text>
    <text x="76" y="424" fill="#535e56" font-size="19">“我和小林上次聊了什么？”</text>
    <path d="M 76 451 H 344" stroke="#e6e8e2"/>
    <text x="76" y="486" fill="#69736c" font-size="17">做过的事 · 认识的人</text>
    <text x="76" y="517" fill="#69736c" font-size="16">可选的日常语音入口</text>

    <rect x="438" y="244" width="324" height="306" rx="18" fill="#eaf0e9" stroke="#c7d3c4"/>
    <text x="466" y="282" fill="#60705f" font-size="15" font-weight="600">02 / PC 在后台保存与连接</text>
    <text x="466" y="339" fill="#253b2c" font-size="27" font-weight="600">EvoMyn</text>
    <rect x="466" y="365" width="268" height="54" rx="10" fill="#fff" stroke="#d4ddd1"/>
    <text x="600" y="399" text-anchor="middle" fill="#354a3a" font-size="20" font-weight="600">MCP · 保存 / 检索 / 更新</text>
    <path d="M 600 426 V 449" fill="none" stroke="#6c756f" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <rect x="466" y="460" width="268" height="58" rx="10" fill="#dce6d9"/>
    <text x="600" y="495" text-anchor="middle" fill="#354a3a" font-size="20" font-weight="600">同一份本地记忆库</text>

    <path d="M 772 392 H 818" fill="none" stroke="#6c756f" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="795" y="367" text-anchor="middle" fill="#69736c" font-size="14">stdio</text>
    <text x="795" y="423" text-anchor="middle" fill="#69736c" font-size="14">MCP</text>

    <rect x="828" y="244" width="324" height="306" rx="18" fill="#fff" stroke="#dce0d9"/>
    <text x="856" y="282" fill="#7a827b" font-size="15" font-weight="600">03 / 多个客户端同时接入</text>
    <text x="856" y="333" fill="#252d28" font-size="24" font-weight="600">Codex / Claude Code</text>
    <text x="856" y="362" fill="#69736c" font-size="16">及其他兼容的 AI 客户端</text>
    <text x="856" y="405" fill="#535e56" font-size="19">整理日志，回顾一段经历</text>
    <text x="856" y="439" fill="#535e56" font-size="19">依据记录看变化、提建议</text>
    <path d="M 856 459 H 1124" stroke="#e6e8e2"/>
    <text x="856" y="494" fill="#535e56" font-size="19">确认后保存为复盘日志</text>
    <text x="856" y="522" fill="#69736c" font-size="16">之后也能通过设备查询</text>

    <rect x="48" y="576" width="1104" height="82" rx="14" fill="#eee9df"/>
    <text x="72" y="607" fill="#5f533d" font-size="19" font-weight="600">设备提醒：记得下一件事</text>
    <text x="72" y="637" fill="#70644f" font-size="17">设好提醒 → 到点响铃 → 确认完成 → 按需归档为日志，让做过的事留下记录。</text>

    <rect x="48" y="682" width="1104" height="78" rx="14" fill="#eeeee8"/>
    <text x="72" y="713" fill="#35443b" font-size="19" font-weight="600">无需自建服务器或 PC 公网 IP</text>
    <text x="72" y="740" fill="#69736c" font-size="16">语音记忆需要 PC 在线、MCP 与小智连接运行；小智提供云端语音，分析建议来自所选 AI 模型。</text>
  </g>
</svg>
