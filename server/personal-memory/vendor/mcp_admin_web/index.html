<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>MCP · EvoMyn</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body><a class="skip-link" href="#content">跳到内容</a><div class="shell">
<aside class="sidebar planner-sidebar"><a class="brand desktop-brand" href="/memory/"><span class="brand-mark" aria-hidden="true">◧</span><span class="brand-name">EvoMyn</span></a><nav class="primary-nav" aria-label="工作空间"><a href="/memory/">记忆</a><a href="/memory/planner/">计划</a><a href="/memory/mcp/" class="active" aria-current="page">能力</a><a href="/setup/">接入配置</a></nav></aside>
<div class="workspace"><header class="hero"><h1>能力</h1><div class="service-actions"><button id="start" class="primary-button" disabled>启动</button><button id="stop" disabled>停止</button><button id="restart" class="primary-button" disabled>重启</button><button id="refresh" class="refresh-button" aria-label="刷新状态" title="刷新">↻</button></div></header>
<main id="content" tabindex="-1"><p id="notice" role="status"></p><p id="desktopControlHint" hidden>能力可供已接入的客户端调用。<a href="/setup/">管理客户端接入 ↗</a></p>
<div class="ability-tabs" role="tablist" aria-label="能力管理"><button id="mineTab" role="tab" aria-selected="true" aria-controls="minePane">我的能力</button><button id="marketTab" role="tab" aria-selected="false" aria-controls="marketPane" tabindex="-1">能力商城</button></div>
<section id="minePane" role="tabpanel" aria-labelledby="mineTab">
<section class="service-summary" aria-label="MCP 状态"><div><span class="metric-label">小智桥接进程</span><strong id="processState">读取中</strong><span id="processMeta" class="metric-meta"></span></div><div><span class="metric-label">小智云端</span><strong id="connectionState">—</strong><span id="connectionMeta" class="metric-meta"></span></div><div><span class="metric-label">云端工具</span><strong id="toolCount">—</strong><span id="toolMeta" class="metric-meta"></span></div></section>
<section class="packages" aria-labelledby="packagesTitle"><div class="section-head"><h2 id="packagesTitle">已添加</h2><span>切换会短暂重连</span></div><div id="packages"></div></section>
<section class="activity"><div class="section-head"><h2>小智调用记录</h2><span>最近 50 次</span></div><div class="table-wrap"><table><thead><tr><th>时间</th><th>工具</th><th>结果</th><th>耗时</th></tr></thead><tbody id="calls"></tbody></table></div></section>
</section>
<section id="marketPane" role="tabpanel" aria-labelledby="marketTab" hidden><div class="market-toolbar"><label class="search-box"><span class="sr-only">搜索能力</span><input id="marketSearch" type="search" placeholder="搜索能力" autocomplete="off"></label><a href="https://registry.modelcontextprotocol.io/" target="_blank" rel="noopener noreferrer">浏览官方目录 ↗</a></div><div id="catalog" class="catalog-grid"></div><p id="marketEmpty" class="market-empty" hidden>没有找到相关能力</p></section>
</main></div></div>
<dialog id="detail" aria-labelledby="detailTitle"><div class="detail-head"><h2 id="detailTitle"></h2><button id="closeDetail" aria-label="关闭详情">×</button></div><p id="detailDescription" class="detail-description"></p><div class="detail-meta" id="detailMeta"></div><h3>使用配置</h3><p id="detailSetup"></p><h3>包含工具</h3><div id="detailTools" class="tool-list"></div><div class="detail-footer"><a id="detailSource" target="_blank" rel="noopener noreferrer">查看来源 ↗</a><div><button id="removePackage" class="remove-package" hidden>移除能力</button><button id="detailAction" class="primary-button">安装</button></div></div></dialog>
</body></html>
