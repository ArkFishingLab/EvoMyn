location = /memory {
    return 301 /memory/;
}

location = /memory/planner {
    return 301 /memory/planner/;
}

location ^~ /memory/planner/ {
    auth_basic "EvoMyn";
    auth_basic_user_file /etc/nginx/personal-memory.htpasswd;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8769/;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_buffering off;
}

# This location belongs inside the existing TLS server block only.
location = /planner/ws {
    auth_basic off;
    proxy_pass http://127.0.0.1:8770;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Device-Id $http_device_id;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;
    proxy_buffering off;
}

location = /memory/backup {
    return 302 /memory/#backup;
}

location = /memory/backup/ {
    return 302 /memory/#backup;
}

location ^~ /memory/backup/ {
    auth_basic "EvoMyn";
    auth_basic_user_file /etc/nginx/personal-memory.htpasswd;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8780/;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 70s;
    proxy_buffering off;
}

location ^~ /memory/ {
    auth_basic "EvoMyn";
    auth_basic_user_file /etc/nginx/personal-memory.htpasswd;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    proxy_pass http://127.0.0.1:8768/;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_buffering off;
}
