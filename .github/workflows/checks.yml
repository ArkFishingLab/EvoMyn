name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-pc:
    name: Source policy and isolated PC tests
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The fixture suites stub the embedding engine. Installing the production
      # embedding/model stack here would hide accidental model dependencies.
      - name: Install test-only dependencies
        run: python -m pip install cryptography==50.0.2 filelock==4.1.1 python-dotenv==1.2.2 websockets==15.0.1 mcp==2.3.0
      - name: Audit Git publication candidates
        run: python tools/audit_repository.py
      - name: Repository tooling and source export tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: PC service and portable launcher fixtures
        run: python -m unittest discover -s server/personal-memory/tests -p "test_*.py" -v
      - name: Viewer fixtures
        run: python -m unittest discover -s server/personal-memory/viewer/tests -p "test_*.py" -v
      - name: Planner and viewer JavaScript tests
        run: node --test server/personal-memory/tests/test_planner_web.cjs server/personal-memory/viewer/tests/*.test.mjs
      - name: Round screen preview tests
        run: node --test tests/preview-settings.test.mjs tests/round-layout.test.mjs
      - name: Desktop shell security, lifecycle and signed updater
        run: |
          node --test desktop/tests/*.test.cjs
          python -m unittest discover -s desktop/tests -p "test_staging.py" -v
          python -m unittest discover -s desktop/tests -p "test_device_sync.py" -v

  desktop-backend:
    name: Windows desktop isolated backend
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      MNEMOSYNE_NO_EMBEDDINGS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pinned desktop service dependencies
        run: python -m pip install -r server/personal-memory/requirements.txt
      - name: Exercise real MCP, master gate, cloud transport and process ownership
        run: python -m unittest discover -s desktop/tests -p "test_backend*.py" -v

  native-host:
    name: Firmware host tooling (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Audit Linux source candidates and link fixtures
        run: |
          python tools/audit_repository.py
          python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run upstream host tooling and C++ checks
        run: |
          gcc --version
          c++ --version
          python -X utf8 -I -S tools/run_xiaozhi_host_tests.py
